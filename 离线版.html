  <noscript><div class="shell panel">交互实验需要启用 JavaScript。潜空间在默认模型中是 ℝ¹⁰；每个细胞的近似后验用一个均值向量和一个方差向量表示，抽样后得到一个潜变量向量。第四页把编码器的一次前向计算逐步展开：4 维表达输入经均值头与方差头得到 2 个均值与 2 个方差，再由一份标准正态噪声得到样本 z。</div></noscript>
  <script>
// A small, explicitly educational VAE + two-gene differentiable ODE.
// No RegVelo data or fitted parameters are embedded in this file.
class RNG {
  constructor(seed=42){this.s=seed>>>0;}
  uniform(){this.s=(1664525*this.s+1013904223)>>>0;return (this.s+.5)/4294967296;}
  normal(){return Math.sqrt(-2*Math.log(this.uniform()))*Math.cos(2*Math.PI*this.uniform());}
}
const softplus=x=>x>25?x:Math.log1p(Math.exp(x));
const sigmoid=x=>1/(1+Math.exp(-Math.max(-40,Math.min(40,x))));
function gaussian(x,mu,sd){return Math.exp(-.5*((x-mu)/sd)**2)/(Math.sqrt(2*Math.PI)*sd);}
function analyticPosterior(y,a,tau){const v=tau*tau/(tau*tau+a*a);return {mu:a*y/(tau*tau+a*a),variance:v,sd:Math.sqrt(v)};}
function klGaussian(mu,v,pm,pv){return .5*((v+(mu-pm)**2)/pv-1+Math.log(pv/v));}
function sampleNormal(mu,variance,rng){return mu.map((m,j)=>m+Math.sqrt(variance[j])*rng.normal());}
function demonstrationCells(d=10){
  return Array.from({length:5},(_,i)=>({name:`细胞 ${i+1}`,mu:Array.from({length:d},(_,j)=>Math.sin((i+1)*(j+1)*.72)*1.35+(i-2)*.12),variance:Array.from({length:d},(_,j)=>.12+.12*((i+j)%4))}));
}

let tape=[];
class A {
  constructor(v,back=null){this.v=Number(v);this.g=0;this.back=back;tape.push(this);}
}
const av=x=>x instanceof A?x:new A(x);
function add(a,b){a=av(a);b=av(b);const n=new A(a.v+b.v,()=>{a.g+=n.g;b.g+=n.g;});return n;}
function sub(a,b){a=av(a);b=av(b);const n=new A(a.v-b.v,()=>{a.g+=n.g;b.g-=n.g;});return n;}
function mul(a,b){a=av(a);b=av(b);const n=new A(a.v*b.v,()=>{a.g+=n.g*b.v;b.g+=n.g*a.v;});return n;}
function div(a,b){a=av(a);b=av(b);const n=new A(a.v/b.v,()=>{a.g+=n.g/b.v;b.g-=n.g*a.v/(b.v*b.v);});return n;}
function log(a){a=av(a);const n=new A(Math.log(a.v),()=>{a.g+=n.g/a.v;});return n;}
function sqrt(a){a=av(a);const n=new A(Math.sqrt(a.v),()=>{a.g+=n.g/(2*n.v);});return n;}
function sp(a){a=av(a);const n=new A(softplus(a.v),()=>{a.g+=n.g*sigmoid(a.v);});return n;}
function sig(a){a=av(a);const n=new A(sigmoid(a.v),()=>{a.g+=n.g*n.v*(1-n.v);});return n;}
const sum=xs=>xs.reduce((a,b)=>add(a,b),av(0));
const sq=a=>mul(a,a);
function backward(loss){loss.g=1;for(let i=tape.length-1;i>=0;i--)if(tape[i].g&&tape[i].back)tape[i].back();}
const invsp=x=>Math.log(Math.expm1(x));

function derivative(y,p){
  const alpha=[0,1].map(g=>sp(add(p[`b${g}`],sum([0,1].map(j=>mul(p[`w${g}${j}`],y[2+j]))))));
  const beta=[0,1].map(g=>add(sp(p[`beta${g}`]),.1));
  const gamma=[0,1].map(g=>add(sp(p[`gamma${g}`]),.1));
  return [sub(alpha[0],mul(beta[0],y[0])),sub(alpha[1],mul(beta[1],y[1])),sub(mul(beta[0],y[0]),mul(gamma[0],y[2])),sub(mul(beta[1],y[1]),mul(gamma[1],y[3]))];
}
function integrate(t,p,steps=6){
  let y=[0,0,0,0].map(av);const dt=div(t,steps);
  const shifted=(state,k,f)=>state.map((v,j)=>add(v,mul(mul(dt,f),k[j])));
  for(let k=0;k<steps;k++){
    const k1=derivative(y,p),k2=derivative(shifted(y,k1,.5),p),k3=derivative(shifted(y,k2,.5),p),k4=derivative(shifted(y,k3,1),p);
    y=y.map((v,j)=>add(v,mul(div(dt,6),sum([k1[j],mul(2,k2[j]),mul(2,k3[j]),k4[j]]))));
  }
  return y;
}
function numericState(t,W,b,beta,gamma,steps=160){
  let y=[0,0,0,0];const dt=t/steps;
  const f=s=>{const a=b.map((v,g)=>softplus(v+W[g][0]*s[2]+W[g][1]*s[3]));return [a[0]-beta[0]*s[0],a[1]-beta[1]*s[1],beta[0]*s[0]-gamma[0]*s[2],beta[1]*s[1]-gamma[1]*s[3]];};
  const shift=(s,k,c)=>s.map((v,j)=>v+dt*c*k[j]);
  for(let i=0;i<steps;i++){const a=f(y),b1=f(shift(y,a,.5)),c=f(shift(y,b1,.5)),d=f(shift(y,c,1));y=y.map((v,j)=>v+dt*(a[j]+2*b1[j]+2*c[j]+d[j])/6);}
  return y;
}
function makeData(){
  return Array.from({length:10},(_,i)=>{const time=.25+i*.35;const y=numericState(time,[[.12,.5],[.4,-.1]],[.3,.1],[.7,.9],[.45,.55]);return {name:`细胞 ${i+1}`,x:y,referenceTime:time};});
}

class ToyVAE {
  constructor(seed=42){this.seed=seed;this.data=makeData();this.reset();}
  reset(){
    const r=new RNG(this.seed);this.p={};
    for(let d=0;d<2;d++){
      this.p[`mb${d}`]=0;this.p[`vb${d}`]=-2;
      for(let j=0;j<4;j++){this.p[`m${d}${j}`]=r.normal()*.09;this.p[`v${d}${j}`]=r.normal()*.012;}
    }
    for(let g=0;g<2;g++){
      this.p[`tb${g}`]=-.2+g*.25;
      for(let d=0;d<2;d++)this.p[`t${g}${d}`]=r.normal()*.25;
      for(let j=0;j<2;j++)this.p[`w${g}${j}`]=r.normal()*.04;
      this.p[`b${g}`]=.15;this.p[`beta${g}`]=invsp(.65+g*.1);this.p[`gamma${g}`]=invsp(.4+g*.1);
    }
    this.m={};this.v={};this.epoch=0;this.history=[];this.last=null;
  }
  encoder(i){
    const row=this.data[i].x;const x=[row[2],row[3],row[0],row[1]].map(v=>v/2);
    const mu=[0,1].map(d=>this.p[`mb${d}`]+x.reduce((s,x,j)=>s+x*this.p[`m${d}${j}`],0));
    const variance=[0,1].map(d=>softplus(this.p[`vb${d}`]+x.reduce((s,x,j)=>s+x*this.p[`v${d}${j}`],0))+1e-4);
    return {mu,variance};
  }
  noise(epoch=0){const r=new RNG(this.seed+991+epoch*137);return this.data.map(()=>[r.normal(),r.normal()]);}
  evaluate({lambda=.05,fixedNoise=true,gradient=false,selected=0,epsilon=null,computeLoss=true}={}){
    tape=[];const p=Object.fromEntries(Object.entries(this.p).map(([k,v])=>[k,av(v)]));
    const noise=epsilon??this.noise(fixedNoise?0:this.epoch);let totalRec=av(0),totalKL=av(0);let selectedSnapshot=null;const cells=[];
    this.data.forEach((row,i)=>{

// --- Encoder introspection: the exact numbers of one forward pass. ---------
// Everything below is derived from the current model.p, so the page prints the
// arithmetic the network actually performs, not a redrawn illustration.
function encoderTrace(model,i){
  const row=model.data[i],p=model.p;
  const raw=[row.x[2],row.x[3],row.x[0],row.x[1]]; // spliced A, B then unspliced A, B
  const x=raw.map(v=>v/2);
  const head=(bKey,wKey)=>{
    const b=[0,1].map(d=>p[bKey+d]);
    const w=[0,1].map(d=>x.map((_,j)=>p[wKey+d+j]));
    const terms=w.map(row2=>row2.map((wj,j)=>[wj,x[j],wj*x[j]]));
    const pre=terms.map(ts=>ts.reduce((s,t)=>s+t[2],0));
    return {b,w,terms,pre,value:pre.map((s,d)=>b[d]+s)};
  };
  const mu=head('mb','m'),vraw=head('vb','v');
  // Softplus acts on bias + weighted sum, exactly as in ToyVAE.encoder().
  const pre=vraw.value,act=pre.map(softplus),variance=act.map(v=>v+1e-4),sd=variance.map(Math.sqrt);
  const eps=model.noise(0)[i],z=mu.value.map((m,d)=>m+sd[d]*eps[d]);
  return {i,name:row.name,raw,x,obs:{s:[raw[0],raw[1]],u:[raw[2],raw[3]]},
    mu:{b:mu.b,w:mu.w,terms:mu.terms,sum:mu.pre,value:mu.value},
    variance:{b:vraw.b,w:vraw.w,terms:vraw.terms,sum:vraw.pre,pre,act,value:variance,sd},
    eps,z};
}
// Two principal directions of a small batch, by power iteration with deflation.
function pca2(rows){
  const n=rows.length,d=rows[0].length;
  const mean=Array.from({length:d},(_,k)=>rows.reduce((s,r)=>s+r[k],0)/n);
  const centered=rows.map(r=>r.map((v,k)=>v-mean[k]));
  let M=Array.from({length:d},()=>Array(d).fill(0));
  for(const r of centered)for(let a=0;a<d;a++)for(let b=0;b<d;b++)M[a][b]+=r[a]*r[b]/n;
  const unit=v=>{const s=Math.hypot(...v);return s<1e-12?null:v.map(x=>x/s);};
  const matVec=(A,v)=>A.map(row=>row.reduce((s,a,j)=>s+a*v[j],0));
  const dot=(u,v)=>u.reduce((s,a,j)=>s+a*v[j],0);
  const axes=[],eigen=[];
  for(let k=0;k<2;k++){
    let v=unit(Array.from({length:d},(_,t)=>Math.sin((t+1)*(k+1)*1.7)+.01))??Array.from({length:d},(_,t)=>t===k?1:0);
    for(let it=0;it<300;it++){const nx=unit(matVec(M,v));if(!nx)break;v=nx;}
    const kk=v.reduce((best,t)=>Math.abs(v[t])>Math.abs(v[best])?t:best,0);
    if(v[kk]<0)v=v.map(x=>-x);
    axes.push(v);
    const lam=dot(v,matVec(M,v));
    eigen.push(lam);
    M=M.map((row,a)=>row.map((val,b)=>val-lam*v[a]*v[b]));
  }
  const total=eigen.reduce((s,v)=>s+v,0)||1;
  return {mean,axes,eigen,explained:eigen.map(v=>v/total),scores:centered.map(r=>axes.map(a=>dot(a,r)))};
}
// Pairwise distances in the 4-D encoder input versus the 2-D latent mean.
function pairwiseGeometry(model){
  const trace=model.data.map((_,i)=>encoderTrace(model,i)),pairs=[];
  for(let i=0;i<trace.length;i++)for(let j=i+1;j<trace.length;j++){
    const dx=Math.hypot(...trace[i].x.map((v,k)=>v-trace[j].x[k]));
    const dm=Math.hypot(...trace[i].mu.value.map((v,k)=>v-trace[j].mu.value[k]));
    pairs.push({i,j,dx,dm});
  }
  const mx=pairs.reduce((s,p)=>s+p.dx,0)/pairs.length,my=pairs.reduce((s,p)=>s+p.dm,0)/pairs.length;
  let sxy=0,sxx=0,syy=0;
  for(const p of pairs){const a=p.dx-mx,b=p.dm-my;sxy+=a*b;sxx+=a*a;syy+=b*b;}
  return {pairs,r:sxx>0&&syy>0?sxy/Math.sqrt(sxx*syy):0,trace};
}
function gradientCheck(){
  const model=new ToyVAE(42),r=model.evaluate({gradient:true});const checks=[];
  for(const key of ['m00','v00','t00','w00','beta0','gamma0']){
    const old=model.p[key],h=1e-5;model.p[key]=old+h;const plus=model.evaluate().loss;model.p[key]=old-h;const minus=model.evaluate().loss;model.p[key]=old;
    const numerical=(plus-minus)/(2*h),analytic=r.gradients[key],relativeError=Math.abs(numerical-analytic)/Math.max(1,Math.abs(numerical),Math.abs(analytic));checks.push({key,numerical,analytic,relativeError});
  }
  return checks;
}

 ${sourceDetails()}<section class="recap"><h2>只用文字，重新走一遍训练过程</h2><p>先从输入中取出每个细胞的两种 RNA 表达。编码器为它计算均值和方差，再用噪声生成一次潜变量取值。解码器把潜变量转换成目标基因的时间，动力学模型据此产生表达预测。训练时，程序用观测表达评价这些预测，并加入分布约束；随后计算梯度、更新参数。下一轮使用更新后的同一个模型。点击“只提取结果”时，程序仅计算并展示当前参数给出的结果，不执行参数更新。</p></section><div class="page-links"><span>01 / 04</span><a href="#space">下一页：潜空间到底以什么形式存在 →</a></div>`;

const spaceHTML=()=>hero('02','潜空间，具体存在在哪里？','它在数学上是坐标空间，在程序里表现为数值张量。区分空间、一个点、一个分布，以及一批细胞的矩阵，才能看清模型保存了什么。','<strong>同一细胞，三种相关对象</strong>均值 μ、方差 v、一次样本 z。分布由参数定义；图上的椭圆和点云只是可视化。')+`
 <div class="toolbar"><div class="button-row"><label class="sub">示例来源 <select id="space-source"><option value="demo">独立的五细胞形状示意</option><option value="trained">训练页当前编码器的结果</option></select></label><label class="sub">潜变量维度 <select id="space-dim"><option>2</option><option>3</option><option>5</option><option selected>10</option></select></label></div><span class="tag" id="space-shape">一批均值：5 × 10</span></div>
 <div class="workspace"><section class="panel"><div class="panel-head"><div><h2>一个空间里的点与分布</h2><p class="sub" id="projection-note">只显示第 1、2 个坐标；十维空间的其余坐标没有被画出。</p></div></div><div class="cell-pills" id="cell-pills"></div><canvas id="space-chart" class="chart tall" role="img" aria-label="潜空间中五个细胞的均值、后验轮廓与采样点"></canvas><div class="legend"><span><i></i>细胞均值</span><span><i class="amber"></i>选中细胞的分布轮廓</span><span><i class="pink"></i>从选中分布抽到的点</span></div><div class="button-row mt"><button id="sample-one" class="primary">抽取一个 z</button><button id="sample-many">再抽取 50 个 z</button><button id="clear-samples">清除采样点</button></div><p class="status" id="space-status" role="status">先选一个细胞，再抽样。均值和方差固定时，抽到的点仍然可以不同。</p></section>
 <section class="panel"><h2>改变分布参数，看图怎样响应</h2><p class="sub">这里只改变形状示意中的分布参数；这项交互不代表进行一次 RegVelo 训练。</p><label class="control"><span>第1维均值 μ₁ <output id="mu1-value"></output></span><input id="mu1" type="range" min="-2.4" max="2.4" step=".02"></label><label class="control"><span>第2维均值 μ₂ <output id="mu2-value"></output></span><input id="mu2" type="range" min="-2.4" max="2.4" step=".02"></label><label class="control"><span>第1维方差 v₁ <output id="var1-value"></output></span><input id="var1" type="range" min=".02" max="1.6" step=".02"></label><label class="control"><span>第2维方差 v₂ <output id="var2-value"></output></span><input id="var2" type="range" min=".02" max="1.6" step=".02"></label><div class="readout" id="space-selected"></div><div class="formula">${eqZ}</div><p class="sub">方差增加会扩大不确定范围；均值移动会改变分布中心。一次样本 z 只是其中一个可能取值。</p></section></div>
 <section class="panel wide-panel"><div class="panel-head"><div><h2>程序里实际操作的是这些数值</h2><p class="sub">每行对应一个细胞，每列对应一个潜坐标。选择不同视图，比较同一形状下数值的含义。</p></div><div class="button-row"><button data-kind="mu" class="small primary">均值 μ</button><button data-kind="variance" class="small">方差 v</button><button data-kind="z" class="small">一次采样 z</button></div></div><div class="table-scroll"><table id="tensor-table"></table></div><p class="tensor-note" id="tensor-note"></p><div class="shape-chain"><b>输入表达：B × 2G</b><span>→</span><b>μ：B × D</b><span>＋</span><b>v：B × D</b><span>→</span><b>一次 Z：B × D</b><span>→</span><b>重复抽 S 次：S × B × D</b></div></section>
 <section class="panel wide-panel"><h2>均值与方差，具体从哪里算出来？</h2><p>默认正态潜变量配置下，先拼接同一细胞的剪接后与未剪接表达，再经过共享编码网络。网络的两个输出头分别给出均值和正方差。</p><div class="formula">${eqEncoder}</div><div class="formula">${eqHeads}<span class="caption">Softplus 是让输出为正的平滑函数。这里的正方差与 10⁻⁴ 稳定项，对应本地 RegVelo 传给 scvi Encoder 的默认设置。</span></div><div id="space-equation-values" class="readout"></div><p class="sub">下面只展开当前细胞的前两个坐标；矩阵表格仍保留全部坐标。方差先开平方，再与噪声逐项相乘。</p><p class="sub"><a href="#encoder">去第四页：这两行公式被逐项打印出来，同一批细胞也会同时画在表达空间与潜空间里 →</a></p></section>
 <section class="panel wide-panel"><div class="grid3"><div class="definition"><strong>空间：ℝᴰ</strong><span>所有 D 个实数坐标组成的集合。默认 D=10。坐标轴由模型学习定义，不能仅凭轴编号给它命名为某条生物通路。</span></div><div class="definition"><strong>点：zᵢ ∈ ℝᴰ</strong><span>一个细胞的一次潜变量取值，是长度为 D 的向量。许多细胞的向量可以按行堆成矩阵。</span></div><div class="definition"><strong>分布：qφ(zᵢ|xᵢ)</strong><span>描述这个细胞在潜空间里的可能取值。程序用 μᵢ、vᵢ 定义对角高斯，再从中抽样；图上的云不是额外保存的实体。</span></div></div><div class="formula">${eqQ}</div><div class="callout">潜变量 z、模型输出的逐基因时间 t，以及观测表达 U/S，属于不同对象。z 经过解码器才得到时间；时间再参与动力学计算。</div></section>
 ${sourceDetails()}<section class="recap"><h2>只用文字，重新描述这些对象怎样产生</h2><p>先读取一个细胞的表达数据。编码器据此算出两个长度相同的向量，分别作为均值和方差。它们共同定义这个细胞的近似后验。程序再取一份标准正态噪声，结合均值与方差，得到一个潜变量向量。把各细胞的向量按行放在一起，就得到一批潜变量矩阵；再次抽样时，矩阵数值可以改变，维度含义保持不变。</p></section><div class="page-links"><a href="#training">← 训练怎样改变这些参数</a><a href="#posterior">下一页：后验与近似后验 →</a></div>`;

const posteriorHTML=()=>hero('03','后验：看过数据以后，z 更可能在哪里？','先用一个能算出精确后验的线性高斯例子理解贝叶斯更新，再把它与 RegVelo 编码器给出的近似后验对应起来。','<strong>本页有一份可核对的答案</strong>精确后验来自线性高斯教学模型。RegVelo 的非线性生成过程通常没有这样的解析解。')+`
 <div class="workspace"><section class="panel"><div class="panel-head"><div><h2>先验、精确后验与近似后验</h2><p class="sub">固定已观测到的 y，沿横轴考察不同潜变量 z 的可能性。</p></div><span class="tag amber">可解析教学模型</span></div><canvas id="posterior-chart" class="chart tall" role="img" aria-label="标准正态先验、精确高斯后验和可调近似后验的概率密度曲线"></canvas><div class="legend"><span><i class="blue"></i>先验 p(z)</span><span><i></i>精确后验 p(z|y)</span><span><i class="dashed"></i>近似后验 q(z|y)</span></div><div class="grid3 mt"><div class="readout"><span class="sub">精确后验均值</span><br><strong id="post-mean"></strong></div><div class="readout"><span class="sub">精确后验方差</span><br><strong id="post-var"></strong></div><div class="readout"><span class="sub">KL(q ‖ 精确后验)</span><br><strong id="post-kl"></strong></div></div><p class="status" id="post-status" role="status">减小观测噪声，观察后验如何集中。然后调整 q，使它贴近精确后验。</p></section>
 <section class="panel"><h2>先改变观测，再改变近似</h2><label class="control"><span>观察到的数值 y <output id="y-value"></output></span><input id="y" type="range" min="-3" max="3" step=".05" value="1.5"></label><label class="control"><span>生成关系系数 a <output id="a-value"></output></span><input id="a" type="range" min=".3" max="2" step=".05" value="1"></label><label class="control"><span>观测噪声标准差 τ <output id="tau-value"></output></span><input id="tau" type="range" min=".2" max="2" step=".05" value=".7"></label><hr style="border:0;border-top:1px solid var(--line);margin:21px 0"><label class="control"><span>近似均值 μq <output id="qmu-value"></output></span><input id="qmu" type="range" min="-8" max="8" step=".025" value="0"></label><label class="control"><span>近似标准差 σq <output id="qsd-value"></output></span><input id="qsd" type="range" min=".05" max="2.5" step=".025" value="1"></label><div class="button-row"><button id="q-step" class="primary">最小化 KL 一步</button><button id="q-align">对齐解析解</button></div><p class="sub">“对齐解析解”直接填写已知答案，便于比较；“最小化 KL 一步”实际按这个简单高斯问题的梯度调整 q。两者都不代表训练了 RegVelo。</p></section></div>
 <section class="panel wide-panel"><h2>三种概率对象，分别在说什么？</h2><div class="grid3"><div class="definition"><strong>先验 p(z)</strong><span>还没有针对当前细胞观察表达时，对潜变量的概率假设。默认的标准正态先验以零为中心、单位方差。</span></div><div class="definition"><strong>后验 pθ(z|x)</strong><span>固定当前生成模型参数 θ，观察到表达 x 后，哪些 z 更能解释这些观测。它由贝叶斯公式定义。</span></div><div class="definition"><strong>近似后验 qφ(z|x)</strong><span>编码器根据表达计算出来的、容易采样和求密度的分布。它用来逼近难直接计算的后验。</span></div></div><div class="formula">${M('<msub><mi>p</mi><mi>θ</mi></msub><mo>(</mo><mi>z</mi><mo>|</mo><mi>x</mi><mo>)</mo><mo>=</mo><mfrac><mrow><msub><mi>p</mi><mi>θ</mi></msub><mo>(</mo><mi>x</mi><mo>|</mo><mi>z</mi><mo>)</mo><mi>p</mi><mo>(</mo><mi>z</mi><mo>)</mo></mrow><mrow><mo>∫</mo><msub><mi>p</mi><mi>θ</mi></msub><mo>(</mo><mi>x</mi><mo>|</mo><mi>z</mi><mo>)</mo><mi>p</mi><mo>(</mo><mi>z</mi><mo>)</mo><mi>d</mi><mi>z</mi></mrow></mfrac>')}<span class="caption">分子是“这个 z 解释数据的能力 × 先验支持”；分母把整个分布归一化。</span></div></section>
 <section class="panel wide-panel"><div class="grid2"><div><h2>本页为什么能算出精确后验？</h2><div class="formula">${M('<mi>z</mi><mo>∼</mo><mi>𝒩</mi><mo>(</mo><mn>0</mn><mo>,</mo><mn>1</mn><mo>)</mo><mo>,</mo><mspace width=".5em"/><mi>y</mi><mo>|</mo><mi>z</mi><mo>∼</mo><mi>𝒩</mi><mo>(</mo><mi>a</mi><mi>z</mi><mo>,</mo><msup><mi>τ</mi><mn>2</mn></msup><mo>)</mo>')}</div><div class="formula">${M('<msub><mi>v</mi><mi>post</mi></msub><mo>=</mo><mfrac><msup><mi>τ</mi><mn>2</mn></msup><mrow><msup><mi>τ</mi><mn>2</mn></msup><mo>+</mo><msup><mi>a</mi><mn>2</mn></msup></mrow></mfrac><mo>,</mo><mspace width=".5em"/><msub><mi>μ</mi><mi>post</mi></msub><mo>=</mo><mfrac><mrow><mi>a</mi><mi>y</mi></mrow><mrow><msup><mi>τ</mi><mn>2</mn></msup><mo>+</mo><msup><mi>a</mi><mn>2</mn></msup></mrow></mfrac>')}</div><p>这里生成关系是线性的，先验和观测噪声都是高斯，所以能直接算出后验均值与方差。改变噪声会改变数据提供的信息强度。</p></div><div><h2>RegVelo怎样处理难算的后验？</h2><p>用编码器为每个细胞计算 μᵢ 与 vᵢ，构造对角高斯近似 qφ，再把表达重建和分布约束连接进训练目标。</p><div class="formula">${eqQ}</div><div class="formula small-formula">${M('<mi>log</mi><msub><mi>p</mi><mi>θ</mi></msub><mo>(</mo><mi>x</mi><mo>)</mo><mo>=</mo><mi>ELBO</mi><mo>+</mo><mi>KL</mi><mo>(</mo><msub><mi>q</mi><mi>φ</mi></msub><mo>‖</mo><msub><mi>p</mi><mi>θ</mi></msub><mo>(</mo><mi>z</mi><mo>|</mo><mi>x</mi><mo>)</mo><mo>)</mo>')}</div><p class="sub">ELBO 是“证据下界”。上式是标准变分恒等式；RegVelo 实际总目标还包含 KL 权重和额外惩罚项，不能把它们全部当成同一个标准 ELBO。</p></div></div></section>
 <div class="callout mt">这里讨论的是细胞潜变量 z 的近似后验。当前代码中反复抽取 z，不等于为调控网络每个权重、每个动力学参数都建立了完整后验；它们在这份实现中主要作为可训练参数进行优化。</div>
 ${sourceDetails()}<section class="recap"><h2>只用文字，重新走一遍后验估计</h2><p>先固定当前生成模型的参数，并观察一个细胞的表达。不同潜变量取值，对这份表达的解释能力不同；把这种解释能力与先验结合，就定义了后验。简单线性高斯模型能直接求出答案，图中的实线就是这个答案。RegVelo 的生成过程更复杂，于是编码器用均值和方差给出一个可计算的近似。训练通过表达拟合和分布约束更新网络，使这个近似服务于当前模型的估计过程。</p></section><div class="page-links"><a href="#space">← 看均值、方差和样本的实际形式</a><a href="#training">回到训练：参数怎样更新 →</a></div>`;

function canvas(id){const c=$(id),d=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=Math.round(w*d);c.height=Math.round(h*d);const g=c.getContext('2d');g.scale(d,d);g.clearRect(0,0,w,h);g.font='11px "Microsoft YaHei",sans-serif';return {c,g,w,h};}
const palette={teal:'#087d86',pink:'#ae4774',amber:'#ae6b13',blue:'#4966b2',grid:'#e2e8ed',text:'#687989'};
function axes(g,w,h,{xmin=-4,xmax=4,ymin=-3,ymax=3,xlabel='z₁',ylabel='z₂',ticks=4}={}){
  const l=43,r=18,t=22,b=38,iw=w-l-r,ih=h-t-b;
  const X=x=>l+(x-xmin)/(xmax-xmin)*iw,Y=y=>t+ih-(y-ymin)/(ymax-ymin)*ih;
  g.strokeStyle=palette.grid;g.fillStyle=palette.text;g.lineWidth=1;g.textAlign='center';
  for(let i=0;i<=ticks;i++){const x=xmin+(xmax-xmin)*i/ticks,y=ymin+(ymax-ymin)*i/ticks;g.beginPath();g.moveTo(X(x),t);g.lineTo(X(x),t+ih);g.stroke();g.fillText(fmt(x,Math.abs(xmax-xmin)>10?0:1),X(x),h-18);g.beginPath();g.moveTo(l,Y(y));g.lineTo(l+iw,Y(y));g.stroke();g.textAlign='right';g.fillText(fmt(y,Math.abs(ymax-ymin)>10?0:1),l-7,Y(y)+4);g.textAlign='center';}
  g.fillStyle='#415868';g.fillText(xlabel,l+iw/2,h-2);g.textAlign='left';g.fillText(ylabel,l,t-7);return {X,Y,l,t,iw,ih};
}
function plotEllipse(g,map,mu,variance,color,alpha=1){
  g.save();g.globalAlpha=alpha;g.strokeStyle=color;g.fillStyle=color+'0c';
  for(const k of [1,2]){g.beginPath();for(let i=0;i<=100;i++){const a=i/100*Math.PI*2,x=map.X(mu[0]+k*Math.sqrt(variance[0])*Math.cos(a)),y=map.Y(mu[1]+k*Math.sqrt(variance[1])*Math.sin(a));i?g.lineTo(x,y):g.moveTo(x,y);}if(k===1)g.fill();g.lineWidth=k===1?1.5:1;g.setLineDash(k===2?[4,4]:[]);g.stroke();}
  g.restore();g.fillStyle=color;g.beginPath();g.arc(map.X(mu[0]),map.Y(mu[1]),4,0,Math.PI*2);g.fill();
}
function dot(g,map,x,y,color,r=3){g.fillStyle=color;g.beginPath();g.arc(map.X(x),map.Y(y),r,0,Math.PI*2);g.fill();}
function updateFormulaLabels(){document.querySelectorAll('math').forEach(el=>{if(!el.getAttribute('aria-label'))el.setAttribute('aria-label',el.textContent.replace(/\s+/g,' '));});}
function stop(){playing=false;if(timer)clearTimeout(timer);timer=null;if($('run-train'))$('run-train').textContent='开始训练';}
function renderRoute(){
  stop();stopEncPlayback();const requested=location.hash.slice(1)||'training';active=['training','space','posterior','encoder'].includes(requested)?requested:'training';
  $('main').innerHTML=active==='training'?trainingHTML():active==='space'?spaceHTML():active==='encoder'?encoderHTML():posteriorHTML();
  document.querySelectorAll('[data-route]').forEach(a=>a.setAttribute('aria-current',a.dataset.route===active?'page':'false'));
  document.title=({training:'训练过程',space:'潜空间的存在形式',posterior:'后验与近似后验',encoder:'编码器：两个空间里的位置'}[active])+' · RegVelo 潜空间实验室';
  if(active==='training')setupTraining();else if(active==='space')setupSpace();else if(active==='encoder')setupEncoder();else setupPosterior();updateFormulaLabels();
  window.__latentLab={model,route:active,state:()=>({epoch:model.epoch,space,post,enc:{cell:enc.cell,step:enc.step,proj:enc.proj}}),navigate:route=>{location.hash=route;}};
}
window.addEventListener('hashchange',()=>{renderRoute();window.scrollTo(0,0);});

  for(const id of ['lr','lambda'])$(id).oninput=()=>{stop();stagePacket=null;trainViewMode='inspect';refreshTraining();$('train-status').textContent=id==='lambda'?'KL 权重已改变，当前目标随之改变。曲线保留历史设置下的值。':'学习率只影响后续更新步幅，不会立即改变当前参数。';};

function doTrainingStep(){
  trainViewMode='train';const r=model.step(trainingOptions());

  showStage(6);refreshTraining(r);$('train-status').textContent=`已完成第 ${model.epoch} 次更新。下方前向数值来自本轮更新前，参数表展示这次更新。`;

function refreshTraining(provided=null){

  $('train-latent-readout').innerHTML=`均值 μ = ${vec(s.mu)}<br>方差 v = ${vec(s.variance)}<br>噪声 ε = ${vec(s.eps)}<br>本次样本 z = ${vec(s.z)}`;
  drawLoss();const {g,w,h}=canvas('train-space');const bound=Math.max(3,...s.mu.map((v,j)=>Math.abs(v)+2.4*Math.sqrt(s.variance[j])),...s.z.map(Math.abs));const map=axes(g,w,h,{xmin:-bound,xmax:bound,ymin:-bound,ymax:bound});plotEllipse(g,map,s.mu,s.variance,palette.teal);dot(g,map,s.z[0],s.z[1],palette.pink,5);
}
function drawLoss(){
  const {g,w,h}=canvas('loss-chart');const hist=model.history;
  if(!hist.length){axes(g,w,h,{xmin:0,xmax:10,ymin:-5,ymax:15,xlabel:'参数更新次数',ylabel:'目标值'});g.fillStyle=palette.text;g.textAlign='center';g.fillText('运行一步后，这里会显示实际计算的损失。',w/2,h/2);return;}
  const vs=hist.flatMap(v=>[v.loss,v.reconstruction]),lo=Math.min(...vs),hi=Math.max(...vs),pad=Math.max(1,(hi-lo)*.15);const map=axes(g,w,h,{xmin:0,xmax:Math.max(10,model.epoch),ymin:lo-pad,ymax:hi+pad,xlabel:'参数更新次数',ylabel:'目标值'});

let spaceSampleSerial=0,spaceRows=[];
function loadSpaceCells(){
  if(space.source==='trained'){space.dim=2;space.cells=model.data.map((c,i)=>({name:c.name,...model.encoder(i)}));}
  else space.cells=demonstrationCells(space.dim);
  space.selected=Math.min(space.selected,space.cells.length-1);space.draws=[];makeSpaceRows();
}
function makeSpaceRows(){const r=new RNG(829+spaceSampleSerial);spaceRows=space.cells.map(c=>sampleNormal(c.mu,c.variance,r));}
function setupSpace(){
  loadSpaceCells();$('space-source').value=space.source;$('space-dim').value=space.dim;
  $('space-source').onchange=()=>{space.source=$('space-source').value;loadSpaceCells();refreshSpace();};
  $('space-dim').onchange=()=>{space.dim=Number($('space-dim').value);loadSpaceCells();refreshSpace();};
  for(const id of ['mu1','mu2','var1','var2'])$(id).oninput=()=>{
    const c=space.cells[space.selected],arr=id.startsWith('mu')?c.mu:c.variance,dim=id.endsWith('1')?0:1;arr[dim]=Number($(id).value);space.draws=[];makeSpaceRows();refreshSpace();
  };
  $('sample-one').onclick=()=>drawSpaceSamples(1);$('sample-many').onclick=()=>drawSpaceSamples(50);$('clear-samples').onclick=()=>{space.draws=[];refreshSpace();};
  document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{space.kind=b.dataset.kind;if(space.kind==='z'&&!space.draws.length)drawSpaceSamples(1);else refreshSpace();});refreshSpace();
}
function drawSpaceSamples(n){
  const c=space.cells[space.selected],r=new RNG(17+(++spaceSampleSerial)*677);for(let i=0;i<n;i++)space.draws.push(sampleNormal(c.mu,c.variance,r));space.draws=space.draws.slice(-250);spaceRows[space.selected]=space.draws.at(-1).slice();refreshSpace();$('space-status').textContent=`${c.name} 已显示 ${space.draws.length} 个样本。每一个完整样本都有 ${space.dim} 个坐标；图上仅画出前两个。`;
}
function refreshSpace(){
  const c=space.cells[space.selected];$('space-dim').value=space.dim;$('space-dim').disabled=space.source==='trained';
  $('space-shape').textContent=`一批均值：${space.cells.length} × ${space.dim}`;

  $('cell-pills').innerHTML=space.cells.map((c,i)=>`<button data-cell="${i}" class="${i===space.selected?'active':''}">${c.name}</button>`).join('');
  document.querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>{space.selected=Number(b.dataset.cell);space.draws=[];refreshSpace();});
  for(const [id,arr,j] of [['mu1','mu',0],['mu2','mu',1],['var1','variance',0],['var2','variance',1]]){$(id).value=c[arr][j];$(id).disabled=space.source==='trained';$(id+'-value').textContent=fmt(c[arr][j],2);}
  $('space-selected').innerHTML=`${c.name}：<br>μ = ${vec(c.mu)}<br>v = ${vec(c.variance)}<br>前两维标准差 = ${vec(c.variance.slice(0,2).map(Math.sqrt))}`;
  document.querySelectorAll('[data-kind]').forEach(b=>b.classList.toggle('primary',b.dataset.kind===space.kind));
  const key=space.kind;const matrix=key==='z'?spaceRows:space.cells.map(c=>c[key]);
  $('tensor-table').innerHTML=`<thead><tr><th>细胞 / 坐标</th>${Array.from({length:space.dim},(_,j)=>`<th>${key==='mu'?'μ':key==='variance'?'v':'z'}${j+1}</th>`).join('')}</tr></thead><tbody>${matrix.map((row,i)=>`<tr class="${i===space.selected?'selected':''}"><td>${space.cells[i].name}</td>${row.map((v,j)=>`<td class="${j<2?'axis ':''}${v<0?'val-negative':'val-positive'}">${fmt(v,3)}</td>`).join('')}</tr>`).join('')}</tbody>`;
  $('tensor-note').textContent=key==='mu'?'均值矩阵对应 qz_m：每个细胞的分布中心。它可以是负数。':key==='variance'?'方差矩阵对应 qz_v：各坐标的方差，必须为正；标准差是它的平方根。':'样本矩阵对应 z：从每个细胞自己的分布抽一次。表格中选中行使用最近抽到的完整向量。';
  const sample=spaceRows[space.selected];$('space-equation-values').innerHTML=[0,1].map(j=>{const sd=Math.sqrt(c.variance[j]),eps=(sample[j]-c.mu[j])/sd;return `第 ${j+1} 维：${fmt(c.mu[j])} ＋ √${fmt(c.variance[j])} × ${fmt(eps)} ＝ ${fmt(sample[j])}`;}).join('<br>');
  const {g,w,h}=canvas('space-chart');let bound=3.5;space.cells.forEach(c=>{bound=Math.max(bound,...c.mu.slice(0,2).map((v,j)=>Math.abs(v)+2.2*Math.sqrt(c.variance[j])));});space.draws.forEach(z=>{bound=Math.max(bound,Math.abs(z[0])+.2,Math.abs(z[1])+.2);});bound=Math.min(12,bound);const map=axes(g,w,h,{xmin:-bound,xmax:bound,ymin:-bound,ymax:bound});
  space.cells.forEach((c,i)=>{plotEllipse(g,map,c.mu,c.variance,i===space.selected?palette.amber:palette.teal,i===space.selected?1:.35);g.fillStyle='#465c6b';g.fillText(String(i+1),map.X(c.mu[0])+7,map.Y(c.mu[1])-7);});space.draws.forEach(z=>dot(g,map,z[0],z[1],palette.pink,2.3));
}

function setupPosterior(){
  for(const [id,key] of [['y','y'],['a','a'],['tau','tau'],['qmu','mu'],['qsd','sd']]){$(id).value=post[key];$(id).oninput=()=>{post[key]=Number($(id).value);refreshPosterior();};}
  $('q-step').onclick=()=>{const p=analyticPosterior(post.y,post.a,post.tau),before=klGaussian(post.mu,post.sd**2,p.mu,p.variance);post.mu-=.15*(post.mu-p.mu);const grad=Math.max(-2,Math.min(2,post.sd**2/p.variance-1));post.sd=Math.max(.05,Math.min(2.5,post.sd*Math.exp(-.08*grad)));refreshPosterior();const after=klGaussian(post.mu,post.sd**2,p.mu,p.variance);$('post-status').textContent=`对 q 的高斯参数做了一步优化：KL 从 ${fmt(before,4)} 变为 ${fmt(after,4)}。生成模型和观测保持不变。`;};
  $('q-align').onclick=()=>{const p=analyticPosterior(post.y,post.a,post.tau);post.mu=p.mu;post.sd=p.sd;refreshPosterior();$('post-status').textContent='已直接把 q 的均值与方差设为解析答案。这是可解析高斯例子的对照，不代表非线性 RegVelo 的精确后验已知。';};refreshPosterior();
}
function refreshPosterior(){
  for(const [id,key] of [['y','y'],['a','a'],['tau','tau'],['qmu','mu'],['qsd','sd']]){$(id).value=post[key];$(id+'-value').textContent=fmt(post[key],3);}
  const p=analyticPosterior(post.y,post.a,post.tau);$('post-mean').textContent=fmt(p.mu,4);$('post-var').textContent=fmt(p.variance,4);$('post-kl').textContent=fmt(Math.max(0,klGaussian(post.mu,post.sd**2,p.mu,p.variance)),5);
  const {g,w,h}=canvas('posterior-chart');const xmin=Math.min(-4,p.mu-3*p.sd,post.mu-3*post.sd),xmax=Math.max(4,p.mu+3*p.sd,post.mu+3*post.sd),ymax=Math.max(gaussian(0,0,1),gaussian(p.mu,p.mu,p.sd),gaussian(post.mu,post.mu,post.sd))*1.15;const map=axes(g,w,h,{xmin,xmax,ymin:0,ymax,xlabel:'潜变量 z',ylabel:'概率密度',ticks:4});
  const curves=[[0,1,palette.blue,false],[p.mu,p.sd,palette.teal,false],[post.mu,post.sd,palette.pink,true]];
  for(const [mu,sd,color,dashed] of curves){g.beginPath();g.strokeStyle=color;g.lineWidth=2.2;g.setLineDash(dashed?[6,4]:[]);for(let i=0;i<=400;i++){const x=xmin+(xmax-xmin)*i/400,y=gaussian(x,mu,sd);i?g.lineTo(map.X(x),map.Y(y)):g.moveTo(map.X(x),map.Y(y));}g.stroke();}g.setLineDash([]);
  g.fillStyle=palette.text;g.textAlign='right';g.fillText('每条密度曲线下的总面积为 1',w-20,18);
}

 <section class="panel wide-panel"><h2>把这条通路写成公式</h2><div class="formula">${eqEncoder}</div><div class="formula">${eqLinear}<span class="caption">教学模型：没有隐藏层，均值与方差各是一次线性变换。方差头先算出 a，再经 Softplus 变正。</span></div><div class="formula">${eqHeads}<span class="caption">本地 RegVelo 的形式：隐藏向量 h_i = f_φ(x_i) 由 ReLU 隐藏层给出，两个头接在隐藏向量上。方差仍用 Softplus 与 10⁻⁴。</span></div><div class="callout">“对应上”精确地说只有三件事：同一个细胞的 x 被同一组权重读入；编码器因此给出同一个 μ；加上同一份 ε 才得到同一个 z。它不蕴含“基因空间近的细胞在潜空间也近”，也不蕴含坐标轴有生物含义。</div></section>

function roundRectPath(g,x,y,w,h,r){const rr=Math.min(r,Math.min(w,h)/2);g.beginPath();g.moveTo(x+rr,y);g.lineTo(x+w-rr,y);g.quadraticCurveTo(x+w,y,x+w,y+rr);g.lineTo(x+w,y+h-rr);g.quadraticCurveTo(x+w,y+h,x+w-rr,y+h);g.lineTo(x+rr,y+h);g.quadraticCurveTo(x,y+h,x,y+h-rr);g.lineTo(x,y+rr);g.quadraticCurveTo(x,y,x+rr,y);g.closePath();}
function frameBox(rect){
  const l=rect.x+43,t=rect.y+42,r=rect.x+rect.w-11,b=rect.y+rect.h-19;
  return {l,t,r,b,iw:r-l,ih:b-t};
}
// Fit both axes with ONE scale so a circle stays a circle: the visible span of
// each axis follows from the plot aspect instead of being forced equal.
function fitRange(pts,pad,iw,ih){
  let x0=Math.min(...pts.map(p=>p[0])),x1=Math.max(...pts.map(p=>p[0]));
  let y0=Math.min(...pts.map(p=>p[1])),y1=Math.max(...pts.map(p=>p[1]));
  let dx=x1-x0,dy=y1-y0;
  const floor=Math.max(1e-3,Math.max(Math.abs(x0),Math.abs(x1),Math.abs(y0),Math.abs(y1))*.05);
  if(!(dx>1e-9))dx=floor;
  if(!(dy>1e-9))dy=floor;
  dx*=1+2*pad;dy*=1+2*pad;
  const s=Math.min(iw/dx,ih/dy),sx=iw/s,sy=ih/s,cx=(x0+x1)/2,cy=(y0+y1)/2;
  return {xmin:cx-sx/2,xmax:cx+sx/2,ymin:cy-sy/2,ymax:cy+sy/2,spanX:sx,spanY:sy,halfX:sx/2,halfY:sy/2};
}
function drawFrame(g,rect,o){
  const {xmin,xmax,ymin,ymax}=o;
  g.save();roundRectPath(g,rect.x,rect.y,rect.w,rect.h,10);g.fillStyle='#fff';g.fill();g.strokeStyle='#e3e9ec';g.lineWidth=1;g.stroke();g.restore();
  g.textAlign='left';g.font='600 12.5px "Microsoft YaHei",sans-serif';g.fillStyle='#14273d';g.fillText(o.title,rect.x+11,rect.y+17);
  g.font='10.5px "Microsoft YaHei",sans-serif';g.fillStyle='#687989';g.fillText(o.sub,rect.x+11,rect.y+31);
  const {l,t,r,b,iw,ih}=frameBox(rect);
  const X=x=>l+(x-xmin)/(xmax-xmin)*iw,Y=y=>b-(y-ymin)/(ymax-ymin)*ih;
  const n=iw<130?2:iw<210?3:4;
  g.strokeStyle='#e9eef1';g.lineWidth=1;g.font='10px "Microsoft YaHei",sans-serif';g.fillStyle='#8294a1';g.textAlign='center';
  const dec=Math.abs(xmax-xmin)>4?0:2;
  const tickTxt=v=>fmt(Math.abs(v)<Math.pow(10,-dec)/2?0:v,dec);
  for(let i=0;i<=n;i++){
    const xv=xmin+(xmax-xmin)*i/n,yv=ymin+(ymax-ymin)*i/n;
    g.beginPath();g.moveTo(X(xv),t);g.lineTo(X(xv),b);g.stroke();
    g.fillText(tickTxt(xv),X(xv),b+12);
    g.beginPath();g.moveTo(l,Y(yv));g.lineTo(r,Y(yv));g.stroke();
    g.textAlign='right';g.fillText(tickTxt(yv),l-5,Y(yv)+3.5);g.textAlign='center';
  }
  return {X,Y,l,t,r,b,iw,ih};
}
function encLayout(w,h){

function drawBridge(g,rect,wide){

    g.font='10px "Microsoft YaHei",sans-serif';g.fillStyle='#607080';

    g.fillText('x',inX-14,cy-2);
  }else{
    g.textAlign='left';g.fillStyle='#14273d';g.font='600 12px "Microsoft YaHei",sans-serif';g.fillText('编码器 f_φ',rect.x+12,rect.y+21);
    g.textAlign='right';g.fillStyle='#687989';g.font='10.5px "Microsoft YaHei",sans-serif';g.fillText('4 维 x → 2 维 μ, v',rect.x+rect.w-12,rect.y+21);
    g.textAlign='left';g.fillStyle='#087d86';g.fillText(encStage[enc.step],rect.x+12,rect.y+38);
    const cx=rect.x+rect.w/2;
    g.strokeStyle='#c6d8dc';g.lineWidth=1.2;g.setLineDash([4,4]);
    g.beginPath();g.moveTo(cx,rect.y+48);g.lineTo(cx,rect.y+rect.h-13);g.stroke();g.setLineDash([]);
    g.beginPath();g.moveTo(cx-4,rect.y+rect.h-18);g.lineTo(cx,rect.y+rect.h-10);g.lineTo(cx+4,rect.y+rect.h-18);g.stroke();
  }
}
function bezierPoint(p0,c1,c2,p3,t){const u=1-t;return {x:u*u*u*p0.x+3*u*u*t*c1.x+3*u*t*t*c2.x+t*t*t*p3.x,y:u*u*u*p0.y+3*u*u*t*c1.y+3*u*t*t*c2.y+t*t*t*p3.y};}

}
function traceHTML(sel){
  const n3=v=>fmt(v,3),n4=v=>fmt(v,4);
  const sgn=v=>v<0?' - ':' + ';
  const prod=terms=>terms.map(t=>` + (${n3(t[0])}) × ${n3(t[1])}`).join('');
  const sumLine=(b,terms)=>n3(b)+terms.map(t=>sgn(t[2])+n3(Math.abs(t[2]))).join('');
  const muLines=[0,1].map(d=>`μ${d+1} = ${n3(sel.mu.b[d])}${prod(sel.mu.terms[d])}\n    = ${sumLine(sel.mu.b[d],sel.mu.terms[d])} = ${n3(sel.mu.value[d])}`).join('\n\n');
  const vLines=[0,1].map(d=>`a${d+1} = ${n3(sel.variance.b[d])}${prod(sel.variance.terms[d])}\n    = ${sumLine(sel.variance.b[d],sel.variance.terms[d])} = ${n3(sel.variance.pre[d])}\nv${d+1} = Softplus(${n3(sel.variance.pre[d])}) + 0.0001 = ${n4(sel.variance.act[d])} + 0.0001 = ${n4(sel.variance.value[d])}`).join('\n\n');
  const zLines=`ε = [${sel.eps.map(v=>n3(v)).join(', ')}]\n`+[0,1].map(d=>`z${d+1} = μ${d+1} + √v${d+1} × ε${d+1} = ${n3(sel.mu.value[d])} + ${n3(sel.variance.sd[d])} × ${n3(sel.eps[d])} = ${n3(sel.z[d])}`).join('\n');
  const body=[
    `细胞 ${sel.i+1}　s_A = ${n3(sel.obs.s[0])}　s_B = ${n3(sel.obs.s[1])}\n         u_A = ${n3(sel.obs.u[0])}　u_B = ${n3(sel.obs.u[1])}`,
    `x = [s_A, s_B, u_A, u_B] ÷ 2\n  = [${sel.x.map(v=>n3(v)).join(', ')}]　（4 维）`,
    muLines,vLines,zLines,
    `表达空间位置（4 维）：[${sel.x.map(v=>n3(v)).join(', ')}]\n潜空间中心 μ（2 维）：[${sel.mu.value.map(v=>n3(v)).join(', ')}]\n本次样本 z（2 维）：[${sel.z.map(v=>n3(v)).join(', ')}]`
  ];
  const heads=['读取观测','拼接与缩放 → x','均值头 → μ','方差头 → v','重参数化 → z','两个空间里的位置'];
  return body.map((b,k)=>`<div class="trace-block ${enc.step>=k?'done':'pending'}"><div class="trace-head"><span class="trace-idx">${k+1}</span>${heads[k]}</div><div class="trace-body mono">${b}</div></div>`).join('');
}
function headTable(sel,key){
  const blk=key==='mu'?sel.mu:sel.variance;
  const names=key==='mu'?['μ₁','μ₂']:['a₁','a₂'];
  const cols=['W · s_A','W · s_B','W · u_A','W · u_B'];
  const out=key==='mu'?blk.value:blk.pre;
  return `<thead><tr><th>输出</th><th>偏置 b</th>${cols.map(c=>`<th>${c}</th>`).join('')}<th>${key==='mu'?'μ_d':'a_d'}</th></tr></thead><tbody><tr class="xrow"><td>当前 x</td><td>—</td>${sel.x.map(v=>`<td>${fmt(v,3)}</td>`).join('')}<td>—</td></tr>${names.map((nm,d)=>`<tr><td>${nm}</td><td>${fmt(blk.b[d],3)}</td>${blk.w[d].map(v=>`<td>${fmt(v,3)}</td>`).join('')}<td>${fmt(out[d],3)}</td></tr>`).join('')}</tbody>`;
}
function cellsTable(rows){
  const head='<thead><tr><th>细胞</th><th>s_A</th><th>s_B</th><th>u_A</th><th>u_B</th><th>μ₁</th><th>μ₂</th><th>v₁</th><th>v₂</th><th>z₁</th><th>z₂</th></tr></thead>';
  return head+'<tbody>'+rows.map((r,i)=>`<tr data-cell="${i}" class="${i===enc.cell?'selected':''}"><td>${r.name}</td>${r.raw.map(v=>`<td>${fmt(v,3)}</td>`).join('')}${r.mu.value.map(v=>`<td class="val-${v<0?'negative':'positive'}">${fmt(v,3)}</td>`).join('')}${r.variance.value.map(v=>`<td>${fmt(v,3)}</td>`).join('')}${r.z.map(v=>`<td class="val-${v<0?'negative':'positive'}">${fmt(v,3)}</td>`).join('')}</tr>`).join('')+'</tbody>';
}
function drawEncoderDistance(){
  const cvs=canvas('enc-dist-chart');if(!cvs.g)return;
  const {g,w,h}=cvs,geo=pairwiseGeometry(model),xs=geo.pairs.map(p=>p.dx),ys=geo.pairs.map(p=>p.dm);
  const map=axes(g,w,h,{xmin:0,xmax:Math.max(.05,Math.max(...xs)*1.08),ymin:0,ymax:Math.max(.05,Math.max(...ys)*1.1),xlabel:'表达空间距离（4 维输入）',ylabel:'潜空间距离（2 维 μ）',ticks:4});
  for(const p of geo.pairs){const on=p.i===enc.cell||p.j===enc.cell;dot(g,map,p.dx,p.dm,on?palette.amber:palette.teal,on?3.4:2.3);}
  g.textAlign='right';g.font='11px "Microsoft YaHei",sans-serif';g.fillStyle=palette.text;g.fillText(`45 对细胞 · Pearson r = ${fmt(geo.r,3)}`,w-20,15);
  $('enc-corr-tag').textContent=`r = ${fmt(geo.r,3)}`;
  const far=geo.pairs.reduce((a,b)=>b.dx>a.dx?b:a),near=geo.pairs.reduce((a,b)=>b.dx<a.dx?b:a);
  $('enc-dist-note').textContent=`最远的一对是细胞 ${far.i+1} 与 ${far.j+1}：表达空间 ${fmt(far.dx,3)}，潜空间 ${fmt(far.dm,3)}；最近的一对是细胞 ${near.i+1} 与 ${near.j+1}：${fmt(near.dx,3)} 对 ${fmt(near.dm,3)}。这份教学数据只有时间在变，十个细胞几乎落在同一条轨迹上，所以两个空间的距离看起来近似成比例。换成有分化结构的真实数据，这种比例不会被保证：编码器只保证同一个细胞得到同一个位置，不保证距离按比例缩短。`;
}
function encStatusText(rows,sel){
  const lat=rows.map(r=>r.mu.value);
  const spread=Math.max(Math.max(...lat.map(p=>p[0]))-Math.min(...lat.map(p=>p[0])),Math.max(...lat.map(p=>p[1]))-Math.min(...lat.map(p=>p[1])));
  const sd=Math.max(...sel.variance.sd);
  const note=sd>spread*.7?`注意：这个细胞的标准差最大是 ${fmt(sd,2)}，比十个潜均值的整体散布（${fmt(spread,2)}）还大。当前编码器几乎没有把细胞分开，所以它的 1σ 轮廓整个落在画框外，图上用文字标注。做一次“真实更新 40 步”再回来看。`:'';
  return `${sel.name}：x → μ = [${sel.mu.value.map(v=>fmt(v,3)).join(', ')}]，z = [${sel.z.map(v=>fmt(v,3)).join(', ')}]。${note}`;
}
function refreshEncoder(){
  const rows=encRows(),sel=rows[enc.cell];
  $('enc-cell').value=String(enc.cell);$('enc-proj').value=enc.proj;$('enc-all').checked=enc.all;
  $('enc-state').textContent=model.epoch?`模型已更新 ${model.epoch} 次`:'模型尚未训练';
  $('enc-param-tag').textContent=model.epoch?`参数已更新 ${model.epoch} 次`:'初始随机参数';
  $('enc-step-tag').textContent=`第 ${enc.step+1} / 6 步`;
  document.querySelectorAll('[data-enc]').forEach(b=>b.classList.toggle('active',Number(b.dataset.enc)===enc.step));
  $('enc-note').textContent=encStageText[enc.step];
  $('enc-status').textContent=encStatusText(rows,sel);
  $('enc-trace').innerHTML=traceHTML(sel);
  $('enc-mu-table').innerHTML=headTable(sel,'mu');
  $('enc-v-table').innerHTML=headTable(sel,'variance');
  $('enc-cells').innerHTML=cellsTable(rows);
  $('enc-cells').querySelectorAll('[data-cell]').forEach(tr=>tr.onclick=()=>{enc.cell=Number(tr.dataset.cell);refreshEncoder();});
  $('enc-shape-tag').textContent=`X ${rows.length} × 4 → μ ${rows.length} × 2`;
  drawEncoderStage(rows);drawEncoderDistance();
}
function setupEncoder(){
  enc.playing=false;if(enc.timer){clearTimeout(enc.timer);enc.timer=null;}
  enc.cell=Math.min(enc.cell,model.data.length-1);
  $('enc-cell').value=String(enc.cell);$('enc-proj').value=enc.proj;$('enc-all').checked=enc.all;
  $('enc-cell').onchange=()=>{stopEncPlayback();enc.cell=Number($('enc-cell').value);refreshEncoder();};
  $('enc-proj').onchange=()=>{stopEncPlayback();enc.proj=$('enc-proj').value;refreshEncoder();};
  $('enc-all').onchange=()=>{enc.all=$('enc-all').checked;refreshEncoder();};
  $('enc-step').onclick=()=>{stopEncPlayback();enc.step=enc.step>=5?0:enc.step+1;$('enc-step').textContent=enc.step>=5?'重新从第 1 步运行':'下一阶段';refreshEncoder();};
  $('enc-auto').onclick=()=>{if(enc.playing){stopEncPlayback();return;}enc.playing=true;enc.step=0;$('enc-auto').textContent='暂停';refreshEncoder();const tick=()=>{if(!enc.playing||active!=='encoder')return;if(enc.step>=5){stopEncPlayback();return;}enc.step++;refreshEncoder();enc.timer=setTimeout(tick,760);};enc.timer=setTimeout(tick,760);};
  document.querySelectorAll('[data-enc]').forEach(b=>b.onclick=()=>{stopEncPlayback();enc.step=Number(b.dataset.enc);$('enc-step').textContent=enc.step>=5?'重新从第 1 步运行':'下一阶段';refreshEncoder();});
  $('enc-canvas').onclick=e=>{const box=e.currentTarget.getBoundingClientRect(),x=e.clientX-box.left,y=e.clientY-box.top;let best=-1,bd=1e9;encHit.forEach(p=>{const d=(p.x-x)**2+(p.y-y)**2;if(d<bd){bd=d;best=p.i;}});if(best>=0&&bd<420){stopEncPlayback();enc.cell=best;refreshEncoder();}};
  $('enc-train').onclick=()=>{
    stopEncPlayback();enc.ghost=encRows().map(r=>r.mu.value.slice());const before=enc.ghost[enc.cell].slice();
    for(let k=0;k<40;k++){const r=model.step({lr:.012,lambda:.05,fixedNoise:true,selected:enc.cell});if(r.error){$('enc-train-status').textContent=r.error;return;}}
    refreshEncoder();const now=encRows()[enc.cell].mu.value;
    $('enc-train-status').textContent=`已执行 40 次真实更新（与训练页共用模型，更新计数 ${model.epoch}）。${model.data[enc.cell].name} 的 μ 从 [${before.map(v=>fmt(v,3)).join(', ')}] 变为 [${now.map(v=>fmt(v,3)).join(', ')}]，而它在左图的 x 没有变。`;
  };
  $('enc-clear-ghost').onclick=()=>{enc.ghost=null;refreshEncoder();$('enc-train-status').textContent='已清除更新前的叠加；参数保持在上一次更新的结果。';};
  $('enc-step').textContent=enc.step>=5?'重新从第 1 步运行':'下一阶段';
  refreshEncoder();
}

renderRoute();
</script>
</body>
